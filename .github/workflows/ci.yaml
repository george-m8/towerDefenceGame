name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Option A (recommended): does it build?
      - run: npm run build

      # Option B: does the dev server actually start and respond?
      - name: Boot dev server
        run: |
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 60000