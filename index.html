<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keep Defence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="desktop">
      <section class="window map-window">
        <header class="title-bar"><span class="title">Keep Defence</span></header>
        <canvas id="map"></canvas>
        <div id="game-over" class="dialog" hidden></div>
        <div id="waiting" class="dialog" hidden></div>
        <div id="start" class="dialog" hidden></div>
        <div id="notice" class="dialog" hidden></div>
      </section>
      <aside class="window panel-window">
        <header class="title-bar"><span class="title">Keep</span></header>
        <div id="online" class="panel online" hidden></div>
        <div id="panel" class="panel"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
