<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keep Defence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="desktop">
      <section class="window map-window">
        <header class="title-bar"><span class="title">Keep Defence</span></header>
        <canvas id="map"></canvas>
        <div id="game-over" class="dialog" hidden></div>
        <div id="waiting" class="dialog" hidden></div>
        <div id="start" class="dialog" hidden></div>
        <div id="notice" class="dialog" hidden></div>
        <div id="journal" class="dialog" hidden></div>
        <p id="toast" class="toast" hidden></p>
      </section>
      <aside class="window panel-window">
        <header class="title-bar"><span class="title">Keep</span></header>
        <div class="panel minimap-box">
          <canvas id="minimap" title="Click or drag to move the view"></canvas>
          <div class="zoom-controls">
            <button class="button" data-zoom="out" title="Zoom out (-)">-</button>
            <button class="button" data-zoom="in" title="Zoom in (+)">+</button>
            <button class="button" data-zoom="fit" title="Show the whole map">Fit</button>
          </div>
        </div>
        <div id="online" class="panel online" hidden></div>
        <div id="panel" class="panel"></div>
        <div id="sound" class="panel sound"></div>
      </aside>
    </main>
    <div id="intro" class="intro" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
