<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keep Defence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="desktop">
      <section class="map-window">
        <canvas id="map"></canvas>
        <div id="hud" class="hud" hidden></div>
        <div class="map-left">
          <div id="map-buttons" class="map-buttons"></div>
        </div>
        <p id="status" class="status-line" hidden></p>
        <div class="sky-controls">
          <div id="sun" class="overlay-box sun-slider" hidden></div>
          <div id="clock" class="overlay-box clock-controls" hidden></div>
        </div>
        <div class="map-side">
          <div id="minimap-box" class="minimap-box">
            <canvas id="minimap" title="Click or drag to move the view"></canvas>
            <div class="zoom-controls">
              <button class="button" data-zoom="out" title="Zoom out (-)">-</button>
              <button class="button" data-zoom="in" title="Zoom in (+)">+</button>
              <button class="button" data-zoom="fit" title="Zoom out as far as it goes: the map from edge to edge">Fit</button>
              <button class="button" data-turn title="Flip the view round (Q)">⇅</button>
            </div>
          </div>
          <div id="info-box" class="overlay-box info-box"></div>
          <div id="panel" class="overlay-box controls-box" hidden></div>
          <div id="online" class="overlay-box online" hidden></div>
        </div>
        <div id="settings" class="dialog settings-dialog" hidden>
          <div class="window dialog-window settings-window">
            <header class="title-bar"><span class="title">Settings</span></header>
            <div id="sound" class="sound"></div>
            <div id="pointer" class="pointer"></div>
            <button class="button" data-action="close-settings">Close</button>
          </div>
        </div>
        <canvas id="curtain" class="curtain" hidden></canvas>
        <div id="game-over" class="dialog" hidden></div>
        <div id="waiting" class="dialog" hidden></div>
        <div id="start" class="dialog" hidden></div>
        <div id="notice" class="dialog" hidden></div>
        <div id="journal" class="dialog" hidden></div>
        <p id="toast" class="toast" hidden></p>
        <div id="editor" class="editor"></div>
        <button id="editor-back" class="button editor-back">Back to editor</button>
        <div id="items-editor" class="dialog" hidden></div>
        <div id="editor-dialog" class="dialog" hidden></div>
      </section>
    </main>
    <div id="intro" class="intro" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
